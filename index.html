  <body class="bg-[#FAF6EC] dark:bg-[#121A16] text-[#14332A] dark:text-[#EAE6DB] antialiased selection:bg-[#C9A24B]/30 min-h-screen">
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script>
      // Automatic cache purge whenever build version updates
      var CURRENT_BUILD = "v2026-09-19-build8";
      var savedBuild = localStorage.getItem("warsh_build_ver");
      if (savedBuild !== CURRENT_BUILD) {
        localStorage.setItem("warsh_build_ver", CURRENT_BUILD);
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              if (!name.includes('audio')) {
                caches.delete(name);
              }
            });
          });
        }
      }

      if ('serviceWorker' in navigator) {
        var isReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!isReloading) {
            isReloading = true;
            window.location.reload();
          }
        });
        navigator.serviceWorker.register('/app-cache/sw.js', { scope: '/' })
          .then(function(reg) {
            if (reg) reg.update();
          })
          .catch(function() {
            navigator.serviceWorker.register('/app-cache/sw.js')
              .then(function(r) { if (r) r.update(); })
              .catch(function() {});
          });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
